[package]
name = "codexgo"
version = "1.0.0"
description = "CodexGo by Vexlune Hub - generic OpenAI-compatible API routing for Codex on Windows"
authors = ["Hinln"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "codex_api_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "CodexGo"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
fs2 = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1.48.0", features = ["net", "rt", "sync", "time"] }
toml_edit = "0.23.7"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "3.23.0"
